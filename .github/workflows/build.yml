name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test unsigned packages
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Build and run tests
        shell: pwsh
        run: |
          $testStage = Join-Path $env:RUNNER_TEMP "npp-translate-test-stage"
          $arguments = @(
            ".\NppTranslatePanel.Tests\NppTranslatePanel.Tests.csproj",
            "/t:Restore,Build",
            "/p:Configuration=Release",
            "/p:Platform=x64",
            "/p:RuntimeIdentifier=win-x64",
            "/p:NppPluginsDir64=$testStage",
            "/p:NppPluginsDir32=$testStage"
          )
          & msbuild @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Test build failed."
          }

          $testExecutable = Get-ChildItem ".\NppTranslatePanel.Tests\bin" -Recurse -Filter "NppTranslatePanel.Tests.exe" |
            Where-Object { $_.FullName -match "[\\/]Release[\\/]" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $testExecutable) {
            throw "The test executable was not produced."
          }

          & $testExecutable.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Tests failed."
          }

      - name: Build release packages
        id: package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -notmatch "^v(?<version>\d+\.\d+\.\d+)$") {
              throw "Release tags must use the form vMAJOR.MINOR.PATCH."
            }
            $version = $Matches.version
          }
          else {
            $version = "ci"
          }

          .\build-release.ps1 -Version $version

          $artifactDirectory = Join-Path $PWD ("artifacts\v" + $version)
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $dll = Get-Item (Join-Path $artifactDirectory "stage-x64\NppTranslatePanel\NppTranslatePanel.dll")
            $expectedFileVersion = $version + ".0"
            if ($dll.VersionInfo.FileVersion -ne $expectedFileVersion) {
              throw "Tag version $version does not match DLL version $($dll.VersionInfo.FileVersion)."
            }
          }

          $checksumLines = Get-ChildItem $artifactDirectory -Filter "*.zip" |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          [IO.File]::WriteAllLines(
            (Join-Path $artifactDirectory "SHA256SUMS.txt"),
            $checksumLines,
            [Text.UTF8Encoding]::new($false))

          $relativeArtifactDirectory = "artifacts/v" + $version
          "artifact_directory=$relativeArtifactDirectory" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Upload unsigned signing input
        id: upload-unsigned-signing-input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NppTranslatePanel-signing-input-${{ github.run_id }}
          path: |
            ${{ steps.package.outputs.artifact_directory }}/stage-x64/NppTranslatePanel/NppTranslatePanel.dll
            ${{ steps.package.outputs.artifact_directory }}/stage-x86/NppTranslatePanel/NppTranslatePanel.dll
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NppTranslatePanel-unsigned-${{ github.run_id }}
          path: |
            ${{ steps.package.outputs.artifact_directory }}/*.zip
            ${{ steps.package.outputs.artifact_directory }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
